<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7F4" />
      <stop offset="100%" stop-color="#E5EFE7" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123D2B" />
      <stop offset="100%" stop-color="#002618" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C" />
      <stop offset="100%" stop-color="#D4A64A" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.15" stroke="#123D2B" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    
    <line x1="0" y1="40" x2="400" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Central Card -->
  <rect x="90" y="80" width="220" height="240" rx="16" fill="#FFFFFF" filter="url(#softShadow)" />

  <!-- Pouch / Pack Illustration -->
  <g transform="translate(145, 115)">
    <!-- Package body -->
    <path d="M15 15 L95 15 L105 130 C105 136, 100 142, 92 142 L18 142 C10 142, 5 136, 5 130 Z" fill="#E8F2EC" stroke="#123D2B" stroke-width="2.5" />
    <!-- Seal top crimp -->
    <path d="M10 5 L100 5 L95 15 L15 15 Z" fill="#D4A64A" stroke="#123D2B" stroke-width="2" />
    <line x1="20" y1="5" x2="20" y2="15" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="35" y1="5" x2="35" y2="15" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="55" y1="5" x2="55" y2="15" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="75" y1="5" x2="75" y2="15" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="90" y1="5" x2="90" y2="15" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Label on pack -->
    <rect x="25" y="38" width="60" height="52" rx="6" fill="#FFFFFF" stroke="#D1DFD5" stroke-width="1" />
    
    <!-- Spice / grain icon inside label -->
    <circle cx="55" cy="58" r="14" fill="#FEF3C7" />
    <path d="M55 48 C49 55, 48 64, 55 69 C62 64, 61 55, 55 48 Z" fill="#D97706" />

    <!-- Barcode lines on pack -->
    <g transform="translate(30, 104)" fill="#123D2B">
      <rect x="0" y="0" width="2" height="18" />
      <rect x="4" y="0" width="1" height="18" />
      <rect x="7" y="0" width="3" height="18" />
      <rect x="12" y="0" width="1" height="18" />
      <rect x="15" y="0" width="2" height="18" />
      <rect x="19" y="0" width="3" height="18" />
      <rect x="24" y="0" width="1" height="18" />
      <rect x="28" y="0" width="4" height="18" />
      <rect x="34" y="0" width="2" height="18" />
      <rect x="38" y="0" width="1" height="18" />
      <rect x="42" y="0" width="3" height="18" />
      <rect x="47" y="0" width="2" height="18" />
    </g>
  </g>

  <!-- Verified Seal Badge -->
  <g transform="translate(260, 240)" filter="url(#softShadow)">
    <circle cx="24" cy="24" r="24" fill="url(#primaryGrad)" />
    <circle cx="24" cy="24" r="21" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 2" />
    <!-- Checkmark & Shield -->
    <path d="M24 14 L33 18 V25 C33 30.5, 29.2 35.5, 24 37 C18.8 35.5, 15 30.5, 15 25 V18 Z" fill="#123D2B" stroke="#D4A64A" stroke-width="1.5" />
    <path d="M20 25 L23 28 L28 22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Caption text -->
  <text x="200" y="350" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#123D2B" letter-spacing="0.5">VERIFIED GROCERY ITEM</text>
  <text x="200" y="370" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#5F7568" letter-spacing="0.3">GS1 Cryptographic Tamper-Proof Chain</text>
</svg>
